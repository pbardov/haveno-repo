name: Publish Debian Repository

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */6 * * *"
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/publish-debian-repo.yml"
      - "scripts/build-debian-repo.sh"
      - "README.md"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils jq

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Debian repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_OWNER: retoaccess1
          SOURCE_REPO: haveno-reto
          SITE_DIR: site
          APT_DIST: stable
          APT_COMPONENT: main
        run: |
          chmod +x scripts/build-debian-repo.sh
          scripts/build-debian-repo.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
