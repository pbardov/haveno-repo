name: Publish Debian Repository

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */6 * * *"
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/publish-debian-repo.yml"
      - "scripts/build-debian-repo.sh"
      - "README.md"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils jq

      - name: Compute Debian assets fingerprint
        id: deb_assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_OWNER: retoaccess1
          SOURCE_REPO: haveno-reto
        run: |
          set -euo pipefail

          api_base="https://api.github.com/repos/${SOURCE_OWNER}/${SOURCE_REPO}/releases"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          if [[ -n "${GITHUB_TOKEN:-}" ]]; then
            headers+=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
          fi

          manifest="$(mktemp)"
          : > "${manifest}"

          page=1
          while :; do
            page_json="$(curl -fsSL "${headers[@]}" "${api_base}?per_page=100&page=${page}")"
            page_count="$(jq 'length' <<<"${page_json}")"
            if [[ "${page_count}" == "0" ]]; then
              break
            fi

            jq -r '
              .[]
              | select((.draft | not) and (.prerelease | not))
              | .assets[]
              | select(.name | endswith(".deb"))
              | [.name, (.size | tostring), .updated_at]
              | @tsv
            ' <<<"${page_json}" >> "${manifest}"

            page=$((page + 1))
          done

          sort -u "${manifest}" -o "${manifest}"
          asset_count="$(wc -l < "${manifest}" | tr -d " ")"
          if [[ "${asset_count}" == "0" ]]; then
            echo "No .deb assets found." >&2
            exit 1
          fi
          hash="$(sha256sum "${manifest}" | awk '{print $1}')"

          echo "asset_count=${asset_count}" >> "${GITHUB_OUTPUT}"
          echo "hash=${hash}" >> "${GITHUB_OUTPUT}"

      - name: Restore Debian package cache
        id: deb_cache
        uses: actions/cache@v4
        with:
          path: site/pool/main
          key: deb-pool-${{ runner.os }}-${{ steps.deb_assets.outputs.hash }}
          restore-keys: |
            deb-pool-${{ runner.os }}-

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Debian repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_OWNER: retoaccess1
          SOURCE_REPO: haveno-reto
          SITE_DIR: site
          APT_DIST: stable
          APT_COMPONENT: main
        run: |
          chmod +x scripts/build-debian-repo.sh
          scripts/build-debian-repo.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
